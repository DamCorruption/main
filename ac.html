<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinematic Distance Explorer</title>
    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-panel: #111827;
            --border-glow: #1e293b;
            --neon-green: #00ff66;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-deep); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
        }
        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        header {
            background-color: var(--bg-panel); border-bottom: 1px solid var(--border-glow);
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
        }
        header h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.025em; color: var(--neon-green); }
        .status {
            font-size: 12px; color: var(--text-muted); font-family: monospace;
            background: #070a12; padding: 6px 12px; border-radius: 4px;
            border: 1px solid #1e293b; max-width: 60%; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .control-panel {
            width: 340px; background-color: var(--bg-panel); border-right: 1px solid var(--border-glow);
            padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto;
        }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
        input[type="file"] {
            background: #1f2937; border: 1px solid var(--border-glow); padding: 8px;
            border-radius: 6px; color: var(--text-main); font-size: 12px; cursor: pointer; width: 100%;
        }
        textarea {
            background: #070a12; border: 1px solid var(--border-glow); padding: 12px;
            border-radius: 6px; color: var(--text-main); font-family: monospace; font-size: 12px;
            resize: none; height: 60px; width: 100%;
        }
        button {
            background: var(--neon-green); color: #000; border: none; padding: 12px;
            border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; width: 100%;
        }
        button:hover { opacity: 0.9; }
        .engine-select-panel { border-top: 1px solid var(--border-glow); padding-top: 15px; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .mode-btn {
            background: #1e293b; color: var(--text-main); text-align: left; padding: 10px 12px;
            font-size: 12px; font-weight: 500; border-radius: 4px; width: 100%; cursor: pointer; border: none;
        }
        .mode-btn.active { background: rgba(0, 255, 102, 0.1); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .plot-panel { flex: 1; background: var(--bg-deep); display: flex; padding: 24px; }
        canvas { width: 100%; height: 100%; border-radius: 8px; background: #070a12; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h2>Kinematic Distance Explorer (Thread-Isolated Web Worker Architecture)</h2>
        <div id="statusMsg" class="status">System idle. Ready to parse deep data buffers.</div>
    </header>
    
    <div class="main-content">
        <div class="control-panel">
            <div class="input-group">
                <label class="input-label">Option A: Upload High-Density JSON</label>
                <input type="file" id="fileInput" accept=".json" />
            </div>
            <div class="input-group">
                <label class="input-label">Option B: Raw Matrix Paste</label>
                <textarea id="dataInput" placeholder="[[x1,y1,z1], [x2,y2,z2]]"></textarea>
            </div>
            <button id="runBtn">Launch Background Worker</button>

            <div class="engine-select-panel" id="engineSelectors" style="display:none;">
                <label class="input-label" style="color:var(--neon-green); display:block; margin-bottom:10px;">Hyperparameters</label>
                <div style="margin-bottom:15px; display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label style="font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px;">Clusters (K)</label>
                        <input type="number" id="paramK" value="6" min="2" max="20" style="width:100%; background:#070a12; border:1px solid #334155; color:#fff; padding:6px; border-radius:4px;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px;">Velocity Weight</label>
                        <input type="number" id="paramLambda" value="1.5" min="0" max="5" step="0.1" style="width:100%; background:#070a12; border:1px solid #334155; color:#fff; padding:6px; border-radius:4px;">
                    </div>
                </div>

                <label class="input-label" style="color:var(--neon-green);">On-The-Fly Processing Mode</label>
                <div class="btn-group">
                    <button class="mode-btn active" data-mode="kmeans">1. Phase-Space Trajectory K-Means</button>
                    <button class="mode-btn" data-mode="gmm">2. Trajectory Gaussian Mixture Model</button>
                    <button class="mode-btn" data-mode="fuzzy">3. Fuzzy Phase-Space C-Means</button>
                </div>
            </div>
        </div>
        <div class="plot-panel"><canvas id="plotCanvas"></canvas></div>
    </div>
</div>

<script>
// Inline Web Worker implementation script logic block
const workerBlobCode = `
    self.onmessage = function(e) {
        const { globalX, targetK, lambda } = e.data;
        const n = globalX.length, f = globalX[0]?.length || 0;
        if(n === 0 || f === 0) { self.postMessage({ type: 'error', msg: 'Empty array space encountered.' }); return; }

        self.postMessage({ type: 'status', msg: 'Worker Thread: Synthesizing phase space vectors...' });
        const augmentedFeatures = f * 2;
        const flatKinematicMatrix = new Float32Array(n * augmentedFeatures);
        
        for (let i = 0; i < n; i++) {
            const rowOffset = i * augmentedFeatures;
            const prev = i === 0 ? globalX[0] : globalX[i - 1];
            const curr = globalX[i];
            const next = i === n - 1 ? globalX[n - 1] : globalX[i + 1];
            for (let j = 0; j < f; j++) {
                flatKinematicMatrix[rowOffset + j] = curr[j];
                flatKinematicMatrix[rowOffset + f + j] = ((next[j] - prev[j]) / 2.0) * lambda;
            }
        }

        self.postMessage({ type: 'status', msg: 'Worker Thread: Projecting multi-dimensional PCA spaces...' });
        const means = new Float32Array(f);
        for (let i = 0; i < n * f; i++) means[i % f] += globalX[Math.floor(i / f)][i % f];
        for (let j = 0; j < f; j++) means[j] /= n;

        function inlinePCA(comps) {
            let p = new Float32Array(f).map(() => Math.random() - 0.5);
            let t = new Float32Array(n);
            for(let iter=0; iter<4; iter++) {
                for(let i=0; i<n; i++) {
                    let s = 0;
                    for(let j=0; j<f; j++) {
                        let val = globalX[i][j] - means[j];
                        if(comps) val -= comps.scores[i] * comps.vector[j];
                        s += val * p[j];
                    }
                    t[i] = s;
                }
                let np = new Float32Array(f);
                for(let i=0; i<n; i++) {
                    for(let j=0; j<f; j++) {
                        let val = globalX[i][j] - means[j];
                        if(comps) val -= comps.scores[i] * comps.vector[j];
                        np[j] += t[i] * val;
                    }
                }
                let norm = Math.sqrt(np.reduce((acc, v) => acc + v*v, 0));
                for(let j=0; j<f; j++) p[j] = np[j] / (norm || 1);
            }
            return { vector: p, scores: t };
        }
        const pc1 = inlinePCA(null), pc2 = inlinePCA(pc1);
        const points = Array.from({length: n}, (_, i) => [pc1.scores[i], pc2.scores[i]]);

        self.postMessage({ type: 'status', msg: 'Worker Thread: Processing algorithmic partitioning passes...' });
        
        // 1. K-Means
        let centroids = new Float32Array(targetK * augmentedFeatures);
        for(let c=0; c<targetK; c++) centroids.set(flatKinematicMatrix.subarray(Math.floor(n/targetK)*c*augmentedFeatures, (Math.floor(n/targetK)*c+1)*augmentedFeatures), c*augmentedFeatures);
        let kmeansAssig = new Int32Array(n).fill(-1);
        for (let iter = 0; iter < 8; iter++) {
            for (let i = 0; i < n; i++) {
                let rowOffset = i * augmentedFeatures, minDist = Infinity, closest = 0;
                for (let c = 0; c < targetK; c++) {
                    let cOffset = c * augmentedFeatures, dSq = 0;
                    for (let j = 0; j < augmentedFeatures; j++) { const d = flatKinematicMatrix[rowOffset + j] - centroids[cOffset + j]; dSq += d * d; }
                    if (dSq < minDist) { minDist = dSq; closest = c; }
                }
                kmeansAssig[i] = closest;
            }
            centroids.fill(0); const counts = new Int32Array(targetK);
            for (let i = 0; i < n; i++) { let c = kmeansAssig[i]; counts[c]++; for(let j=0; j<augmentedFeatures; j++) centroids[c * augmentedFeatures + j] += flatKinematicMatrix[i * augmentedFeatures + j]; }
            for (let c = 0; c < targetK; c++) { if (counts[c] > 0) { for(let j=0; j<augmentedFeatures; j++) centroids[c * augmentedFeatures + j] /= counts[c]; } }
        }

        // 2. GMM Diagonal Profile Matrix
        let gmmMeans = new Float32Array(targetK * augmentedFeatures);
        let gmmVars = new Float32Array(targetK * augmentedFeatures).fill(1.0);
        let gmmWeights = new Float32Array(targetK).fill(1 / targetK);
        let gmmAssig = new Int32Array(n);
        for(let c=0; c<targetK; c++) gmmMeans.set(flatKinematicMatrix.subarray(Math.floor(n/targetK)*c*augmentedFeatures, (Math.floor(n/targetK)*c+1)*augmentedFeatures), c*augmentedFeatures);
        for (let iter = 0; iter < 4; iter++) {
            for (let i = 0; i < n; i++) {
                let rowOffset = i * augmentedFeatures, maxProb = -Infinity, bestCluster = 0;
                for (let c = 0; c < targetK; c++) {
                    let mOffset = c * augmentedFeatures, logProb = Math.log(gmmWeights[c]);
                    for (let j = 0; j < augmentedFeatures; j++) {
                        let diff = flatKinematicMatrix[rowOffset + j] - gmmMeans[mOffset + j];
                        logProb -= 0.5 * (Math.log(2 * Math.PI * gmmVars[mOffset + j]) + (diff * diff) / (gmmVars[mOffset + j] || 0.01));
                    }
                    if (logProb > maxProb) { maxProb = logProb; bestCluster = c; }
                }
                gmmAssig[i] = bestCluster;
            }
        }

        // 3. Fuzzy C Means
        let fcmCentroids = new Float32Array(targetK * augmentedFeatures);
        for(let c=0; c<targetK; c++) fcmCentroids.set(flatKinematicMatrix.subarray(Math.floor(n/targetK)*c*augmentedFeatures, (Math.floor(n/targetK)*c+1)*augmentedFeatures), c*augmentedFeatures);
        let fcmAssig = new Int32Array(n);
        for (let iter = 0; iter < 3; iter++) {
            for (let i = 0; i < n; i++) {
                let rowOffset = i * augmentedFeatures, minDist = Infinity, bestC = 0;
                for (let c = 0; c < targetK; c++) {
                    let cOffset = c * augmentedFeatures, dSq = 0;
                    for (let j = 0; j < augmentedFeatures; j++) { const d = flatKinematicMatrix[rowOffset + j] - fcmCentroids[cOffset + j]; dSq += d * d; }
                    if (dSq < minDist) { minDist = dSq; bestC = c; }
                }
                fcmAssig[i] = bestC;
            }
        }

        self.postMessage({
            type: 'done',
            points: points,
            maps: {
                kmeans: Array.from(kmeansAssig),
                gmm: Array.from(gmmAssig),
                fuzzy: Array.from(fcmAssig)
            }
        });
    };
`;

let globalPoints = null;
let globalClusterMaps = {};
let currentViewMode = 'kmeans';
let workerInstance = null;

// Build structural URL Object out of code blocks to initialize background thread
const blobContainer = new Blob([workerBlobCode], { type: 'application/javascript' });
const workerURL = URL.createObjectURL(blobContainer);

document.getElementById('runBtn').addEventListener('click', handleExecution);
document.getElementById('paramK').addEventListener('change', triggerWorkerComputation);
document.getElementById('paramLambda').addEventListener('change', triggerWorkerComputation);

document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentViewMode = e.target.getAttribute('data-mode');
        if (globalPoints) renderCanvasPlot(globalPoints, globalClusterMaps[currentViewMode]);
    });
});

function updateStatus(msg, isError = false) {
    const statusDiv = document.getElementById('statusMsg');
    if (statusDiv) { statusDiv.textContent = msg; statusDiv.style.color = isError ? '#ff3366' : '#94a3b8'; }
}

let loadedRawDataset = null;

function handleExecution() {
    const fileInput = document.getElementById('fileInput');
    const textInput = document.getElementById('dataInput').value.trim();
    
    if (fileInput.files.length > 0) {
        updateStatus("Parsing incoming local file architecture...");
        const reader = new FileReader();
        reader.onload = (e) => { try { loadedRawDataset = JSON.parse(e.target.result); triggerWorkerComputation(); } catch(err) { updateStatus("JSON parse failure: " + err.message, true); } };
        reader.readAsText(fileInput.files[0]);
    } else if (textInput) {
        try { loadedRawDataset = JSON.parse(textInput); triggerWorkerComputation(); } catch(err) { updateStatus("Input parsing error: " + err.message, true); }
    } else {
        updateStatus("Please load tracking inputs or clear system buffers.", true);
    }
}

function triggerWorkerComputation() {
    if (!loadedRawDataset) return;
    
    if (workerInstance) workerInstance.terminate();
    workerInstance = new Worker(workerURL);
    
    const targetK = parseInt(document.getElementById('paramK').value) || 6;
    const lambda = parseFloat(document.getElementById('paramLambda').value) || 1.5;
    let startTime = performance.now();

    workerInstance.onmessage = function(e) {
        const payload = e.data;
        if (payload.type === 'status') {
            updateStatus(payload.msg);
        } else if (payload.type === 'error') {
            updateStatus(payload.msg, true);
        } else if (payload.type === 'done') {
            globalPoints = payload.points;
            globalClusterMaps = payload.maps;
            
            renderCanvasPlot(globalPoints, globalClusterMaps[currentViewMode]);
            document.getElementById('engineSelectors').style.display = 'block';
            updateStatus(`Execution Complete | Isolated Workers Balanced | N = ${globalPoints.length} | Sync Time: ${(performance.now() - startTime).toFixed(1)}ms`);
        }
    };

    workerInstance.postMessage({ globalX: loadedRawDataset, targetK, lambda });
}

function renderCanvasPlot(points, assignments) {
    const canvas = document.getElementById('plotCanvas'); const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1; const rect = canvas.parentElement.getBoundingClientRect();
    
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr); const w = rect.width, h = rect.height;
    ctx.fillStyle = '#0b0f19'; ctx.fillRect(0, 0, w, h);

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for(let i=0; i<points.length; i++) {
        if (points[i][0] < minX) minX = points[i][0]; if (points[i][0] > maxX) maxX = points[i][0];
        if (points[i][1] < minY) minY = points[i][1]; if (points[i][1] > maxY) maxY = points[i][1];
    }
    const pad = 40, rx = (maxX - minX) || 1, ry = (maxY - minY) || 1;
    const neonPalette = ['#00ff66', '#00e5ff', '#ff007f', '#9d00ff', '#ffb700', '#ff3333', '#00f5d4', '#70e000', '#ff70a6'];
    
    // Batch Vector Path Rendering
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(0, 255, 102, 0.08)';
    for (let i = 1; i < points.length; i++) {
        if (assignments[i] === assignments[i-1]) {
            const x0 = pad + ((points[i-1][0] - minX) / rx) * (w - pad * 2);
            const y0 = h - (pad + ((points[i-1][1] - minY) / ry) * (h - pad * 2));
            const x1 = pad + ((points[i][0] - minX) / rx) * (w - pad * 2);
            const y1 = h - (pad + ((points[i][1] - minY) / ry) * (h - pad * 2));
            if (Math.abs(points[i][0] - points[i-1][0]) < rx * 0.15) {
                ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
            }
        }
    }
    ctx.stroke();

    // High performance discrete point blitting matrix mapping
    const bucketedPoints = Array.from({ length: neonPalette.length }, () => []);
    for (let i = 0; i < points.length; i++) {
        bucketedPoints[assignments[i] % neonPalette.length].push(points[i]);
    }

    const side = points.length > 10000 ? 1.2 : 2.2;
    const offset = side / 2;
    for (let c = 0; c < bucketedPoints.length; c++) {
        const pts = bucketedPoints[c];
        if (pts.length === 0) continue;
        ctx.fillStyle = neonPalette[c];
        for (let i = 0; i < pts.length; i++) {
            const cx = pad + ((pts[i][0] - minX) / rx) * (w - pad * 2);
            const cy = h - (pad + ((pts[i][1] - minY) / ry) * (h - pad * 2));
            ctx.fillRect(cx - offset, cy - offset, side, side);
        }
    }
}
</script>
</body>
</html>
